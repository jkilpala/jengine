<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The editor's app icon: the brand's striped sun at its large-mark
       banding (docs/brand/README.md, "The mark"), in Dusk. The icons in
       icons/ are generated from this file by `cargo tauri icon` - rerun
       `cargo tauri icon icon-source.svg` in editor/src-tauri after changing it. -->
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf5c"/>
      <stop offset="1" stop-color="#ff4f8b"/>
    </linearGradient>
    <mask id="stripes">
      <rect width="1024" height="1024" fill="#fff"/>
      <rect y="531.2" width="1024" height="38.4" fill="#000"/>
      <rect y="665.6" width="1024" height="48" fill="#000"/>
      <rect y="790.4" width="1024" height="57.6" fill="#000"/>
      <rect y="905.6" width="1024" height="118.4" fill="#000"/>
    </mask>
  </defs>
  <circle cx="512" cy="512" r="480" fill="url(#sun)" mask="url(#stripes)"/>
</svg>
