name: Feature request
description: Something the engine or the editor should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to make
      description: The game or tool you are building, and where the engine stops you.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working - a component, a script function, an editor tool.
