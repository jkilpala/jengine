server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self';" always;

    # Cache hashed assets (immutable)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML pages — short cache for freshness
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # AI endpoint — CORS headers for programmatic access
    location /ai/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Cache-Control "public, max-age=3600";

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # The data files (api-spec.json, llm-context.md) and the docs pages
        # under /ai/ (each a folder holding an index.html) share this prefix.
        try_files $uri $uri/ $uri.html =404;
    }

    # Rustdoc static files (built by deploy.sh with `cargo doc`)
    location /rustdoc/ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri $uri/ $uri.html =404;
    }

    # Try the file, then the directory, then the .html page; else a real 404
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }
}
