<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The site's striped sun (src/styles/custom.css .site-title::before), in Dusk. -->
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf5c"/>
      <stop offset="1" stop-color="#ff4f8b"/>
    </linearGradient>
    <mask id="stripes">
      <rect width="32" height="32" fill="#fff"/>
      <rect y="16" width="32" height="2.6" fill="#000"/>
      <rect y="21.8" width="32" height="2.6" fill="#000"/>
      <rect y="27" width="32" height="2.4" fill="#000"/>
    </mask>
  </defs>
  <circle cx="16" cy="16" r="15" fill="url(#sun)" mask="url(#stripes)"/>
</svg>
