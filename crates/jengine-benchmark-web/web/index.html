<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jEngine BunnyMark</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a1e;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        #header {
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 24px;
            font-size: 14px;
            background: #252530;
            width: 100%;
            max-width: 1280px;
            border-bottom: 1px solid #333;
        }
        #header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #89b4fa;
            margin-right: auto;
        }
        .stat {
            display: flex;
            gap: 4px;
        }
        .stat-label {
            color: #888;
        }
        .stat-value {
            color: #a6e3a1;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            min-width: 50px;
        }
        #btn-report {
            background: #89b4fa;
            color: #1a1a1e;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }
        #btn-report:hover { background: #b4d0fb; }
        canvas {
            display: block;
            border: 1px solid #333;
        }
        #footer {
            padding: 8px 20px;
            font-size: 12px;
            color: #666;
            width: 100%;
            max-width: 1280px;
            text-align: center;
        }
        #benchmark-result {
            display: none;
            background: #252530;
            color: #a6e3a1;
            padding: 12px;
            margin: 8px auto;
            max-width: 1280px;
            width: 100%;
            border: 1px solid #333;
            font-size: 13px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        #benchmark-result.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>jEngine BunnyMark</h1>
        <div class="stat">
            <span class="stat-label">Mode:</span>
            <span class="stat-value" id="hud-mode">interactive</span>
        </div>
        <div class="stat">
            <span class="stat-label">Bunnies:</span>
            <span class="stat-value" id="hud-bunnies">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">FPS:</span>
            <span class="stat-value" id="hud-fps">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">Frame:</span>
            <span class="stat-value" id="hud-frame">0ms</span>
        </div>
        <div class="stat">
            <span class="stat-label">Draws:</span>
            <span class="stat-value" id="hud-draws">0</span>
        </div>
        <button id="btn-report">Report</button>
    </div>
    <canvas id="benchmark-canvas" width="1280" height="720"></canvas>
    <div id="footer">
        Click canvas to add bunnies (interactive mode) &bull;
        URL params: <code>?mode=autoramp&amp;count=500&amp;add=200&amp;target_fps=30&amp;frames=1000&amp;sort=true</code>
    </div>
    <pre id="benchmark-result"></pre>
    <script type="module">
        import init, { get_report } from '../pkg/jengine_benchmark_web.js';
        async function run() {
            try {
                await init();
                console.log('jEngine BunnyMark WASM loaded');

                document.getElementById('btn-report').addEventListener('click', () => {
                    const json = get_report();
                    const el = document.getElementById('benchmark-result');
                    el.textContent = json;
                    el.classList.toggle('visible');
                    console.log(json);
                });
            } catch (e) {
                console.error('Failed to initialize BunnyMark:', e);
                document.getElementById('hud-mode').textContent = 'ERROR';
            }
        }
        run();
    </script>
</body>
</html>
