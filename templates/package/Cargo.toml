[package]
name = "{{PACKAGE_NAME}}"
version = "0.1.0"
edition = "2024"
license = "MIT"
{{WORKSPACE}}
[dependencies]
# An engine feature this package uses goes in `features = [...]` here
# (`jengine_core::features::ALL`; docs/writing-packages.md).
jengine-core = { path = "{{CORE_PATH}}", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

# `jengine-core` needs its `web` feature to compile for wasm32, which the
# editor viewport and web builds are; declaring it lets this crate be checked
# for wasm32 on its own.
[target.'cfg(target_arch = "wasm32")'.dependencies]
jengine-core = { path = "{{CORE_PATH}}", default-features = false, features = ["web"] }
